<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Cerood account</title><link rel="icon" href="/favicon.ico"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172033;background:#2454ff}.overlay{min-height:100vh;min-height:var(--view-height,100dvh);display:grid;place-items:center;padding:24px;background:#2454ff}.card{width:min(100%,440px);max-height:calc(var(--view-height,100dvh) - 48px);overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 80px #11182726}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.top img{width:136px;height:40px;object-fit:contain;object-position:left}.close{width:36px;height:36px;min-height:36px;background:#f1f5f9;color:#334155;border-radius:50%;font-size:22px;margin:0;padding:0}h1{font-size:27px;line-height:1.25;font-weight:650;letter-spacing:-.8px;margin:0 0 10px}.muted{color:#64748b;margin:0 0 20px}.number{font-size:13px;color:#475569}.number button{width:auto;margin:0 0 0 8px;background:none;color:#2454ff;min-height:28px;padding:0 5px}label{display:block;font-size:13px;font-weight:500;margin:18px 0 7px}input{width:100%;min-height:48px;padding:12px 14px;border:1px solid #dce3ee;border-radius:9px;background:#fff;color:#172033;font-family:inherit;font-size:16px;line-height:1.4}input:focus{outline:2px solid #2454ff;outline-offset:2px}button{width:100%;min-height:48px;border:0;border-radius:9px;background:#2454ff;color:#fff;padding:12px 16px;margin-top:20px;font:600 14px system-ui;cursor:pointer}button:disabled{background:#edf0f5!important;color:#9aa3af!important;cursor:not-allowed}.link{width:auto;min-height:32px;padding:4px 0;background:none;color:#2454ff;font-size:13px;margin:10px 0 0}.foot{color:#64748b;font-size:13px;text-align:center;margin-top:24px}.password{position:relative}.password input{padding-right:62px}.password button{width:56px;min-height:40px;position:absolute;right:4px;top:4px;margin:0;padding:0;background:transparent;color:#475569;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.row button{width:auto}.timer{font-size:12px;color:#64748b}.legal{font-size:11px;color:#94a3b8;text-align:center;margin:22px 0 0}.legal a{color:#64748b}#status{color:#b42318;font-size:13px;margin:14px 0 0;overflow-wrap:anywhere}#captcha{min-height:56px;margin:16px 0}#otp{text-align:center;letter-spacing:7px;font-size:22px}[hidden]{display:none!important}
@media(max-width:540px){.overlay{padding:12px;align-items:start;padding-top:max(16px,env(safe-area-inset-top))}.card{padding:24px 22px;width:100%;max-height:calc(var(--view-height,100dvh) - 28px);border-radius:16px}.top{margin-bottom:24px}h1{font-size:25px}}

.mode-tabs{display:flex;gap:4px;background:#f1f5fa;border-radius:10px;padding:4px;margin:0 0 18px}.mode-tabs button{flex:1;width:auto;min-height:38px;margin:0;padding:8px;background:transparent;color:#64748b;font-size:13px}.mode-tabs button[aria-pressed="true"]{background:#fff;color:#2454ff;box-shadow:0 2px 5px #1720330c}.flow-caption{font-size:11px;font-weight:600;color:#2454ff;letter-spacing:.4px;margin:0 0 10px}.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 24px}.steps li{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:#94a3b8;line-height:1.3}.steps li::before{content:'';height:3px;border-radius:4px;background:#e9edf4}.steps li.current{color:#2454ff;font-weight:650}.steps li.current::before,.steps li.done::before{background:#2454ff}.steps li.done{color:#526587}.next-hint{font-size:12px;color:#64748b;margin:20px 0 0;padding-top:14px;border-top:1px solid #edf0f5}.password-note{font-size:12px;line-height:1.5;color:#64748b;margin:8px 0 0}.password-note.match{color:#157347}.otp-status{margin-top:16px;padding:12px;background:#f5f7ff;border-radius:9px}.otp-status .row{align-items:center;flex-wrap:wrap;gap:4px}.otp-status .timer{font-size:12px}.otp-status #resend{font-size:12px;margin:0;padding:8px;min-height:36px;border-radius:6px}#backStep{display:block;margin:14px 0 0}.top{margin-bottom:20px}.card{width:min(100%,460px)}
@media(max-width:380px){.card{padding:22px 18px}.steps li{font-size:10px}.otp-status .row{display:block}.otp-status #resend{display:block;margin-top:7px}}
</style></head><body><div class="overlay" id="overlay"><section class="card" role="dialog" aria-modal="true" aria-labelledby="heading"><div class="top"><img src="/brand/logo.png" alt="Cerood"><button class="close" id="close" type="button" aria-label="Close account">×</button></div><div class="mode-tabs" id="modeTabs" role="group" aria-label="Choose account action"><button id="loginTab" type="button" aria-pressed="true">Log in</button><button id="registerTab" type="button" aria-pressed="false">Create account</button></div><p id="flowCaption" class="flow-caption"></p><ol id="steps" class="steps" aria-label="Account steps"></ol><h1 id="heading">Log in or sign up</h1><p id="description" class="muted">Enter your mobile number to continue.</p><p id="numberLine" class="number" hidden><span id="numberLabel"></span><button id="change" type="button">Edit</button></p>
<form id="phoneForm"><label for="phone">Mobile number</label><input id="phone" name="cerood-shopping-mobile" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="username" required><button type="submit" id="phoneContinue">Continue to password</button></form>
<form id="loginForm" hidden><label for="loginPassword">Password</label><div class="password"><input id="loginPassword" name="cerood-shopping-password" type="password" autocomplete="current-password" required><button type="button" data-eye="loginPassword" aria-label="Show password">Show</button></div><div class="row"><span></span><button class="link" id="forgot" type="button">Forgot password?</button></div><button type="submit">Log in</button><p class="foot">New to Cerood? <button class="link" id="register" type="button">Create an account</button></p></form>
<form id="passwordForm" hidden><label for="newPassword">Create password</label><div class="password"><input id="newPassword" aria-describedby="passwordHint" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-eye="newPassword" aria-label="Show new password">Show</button></div><p id="passwordHint" class="password-note">At least 8 characters. You will enter it again below.</p><label for="confirmPassword">Confirm password</label><div class="password"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-eye="confirmPassword" aria-label="Show confirm password">Show</button></div><p id="passwordMatch" class="password-note" role="status" aria-live="polite"></p><button type="submit" id="passwordContinue">Continue to OTP</button></form>
<div id="securityStep" hidden><div id="captcha"></div><button id="send" type="button">Send OTP</button></div>
<form id="otpForm" hidden><label for="otp">Verification code</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" maxlength="8" required><button type="submit">Verify and continue</button><div class="otp-status"><div class="row"><span id="countdown" class="timer"></span><button id="resend" type="button" class="link" disabled>Resend OTP</button></div></div></form>
<form id="profileForm" hidden><p class="muted">Add your name and delivery PIN code.</p><label for="name">Name</label><input id="name" autocomplete="name" maxlength="150" required><label for="email">Email (optional)</label><input id="email" type="email" autocomplete="email" maxlength="180"><label for="pincode">PIN code</label><input id="pincode" autocomplete="postal-code" inputmode="numeric" maxlength="6" pattern="[1-9][0-9]{5}" required><button type="submit">Create account</button></form>
<p id="status" role="alert"></p><p id="nextHint" class="next-hint"></p><button id="backStep" type="button" class="link" hidden>← Back</button><p class="legal">By continuing, you agree to our <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="/privacy-policy.html" target="_blank" rel="noopener">Privacy policy</a>.</p></section></div>
<script>
(function(){'use strict';const API='https://catus-backend-d2js.onrender.com',$=id=>document.getElementById(id),ids=['phoneForm','loginForm','passwordForm','securityStep','otpForm','profileForm'];let mode='login',phone='',password='',proof='',request='',busy=false,deadline=0,timer=null,loader=null;
function send(type){if(parent!==window)parent.postMessage({source:'cerood-auth-frame',type},location.origin);else if(type==='close')location.assign('/shop.html');}function show(id,title,description){ids.forEach(x=>$(x).hidden=x!==id);$('heading').textContent=title;$('description').textContent=description||'';$('numberLine').hidden=id==='phoneForm';$('numberLabel').textContent='+91 '+phone;$('status').textContent='';updateSteps(id);}function error(e){$('status').textContent=e?.message||'Unable to continue. Please try again.';}function tick(){const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('resend').disabled=busy||left>0;const time=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('countdown').textContent=left?'Resend available in '+time:'You can resend the OTP now.';$('resend').textContent=busy?'Please wait…':left?'Resend OTP ('+time+')':'Resend OTP';if(!left&&timer){clearInterval(timer);timer=null;}}function cooldown(){deadline=Date.now()+60000;if(timer)clearInterval(timer);tick();timer=setInterval(tick,250);}function lock(value){busy=value;document.querySelectorAll('form button[type="submit"],#send,#change,#register,#forgot,#backStep,#loginTab,#registerTab').forEach(b=>b.disabled=value);tick();}async function task(fn){if(busy)return;lock(true);$('status').textContent='';try{await fn();}catch(e){error(e);}finally{lock(false);}}
async function json(path,body,token){const r=await fetch(API+path,{method:body?'POST':'GET',credentials:'omit',cache:'no-store',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},signal:AbortSignal.timeout(45000),...(body?{body:JSON.stringify(body)}:{})});let data;try{data=await r.json();}catch{throw Error('Account service returned an invalid response. Please retry.');}if(!r.ok||data.success===false)throw Error(data.message||data.error||'Unable to continue.');return data;}
async function finish(data){const token=data.customer_session||data.renewed_session||data.token;if(typeof token!=='string'||!token)throw Error('Shopping session unavailable. Please try signing in again.');const before=localStorage.getItem('cerood_customer_session');const profile=await json('/api/customer/profile',null,token);if(localStorage.getItem('cerood_customer_session')!==before)throw Error('Your shopping account changed in another tab. Please try again.');const user=profile.user;if(!user?.id||String(user.phone)!==phone)throw Error('Account could not be confirmed. Please sign in again.');localStorage.setItem('cerood_customer_session',token);localStorage.setItem('cerood_renewed_customer_session',token);localStorage.setItem('catus_logged_user',JSON.stringify({id:user.id,name:user.name||'',email:user.email||'',phone:user.phone,pincode:user.pincode||'',address:user.address||''}));password='';proof='';['loginPassword','newPassword','confirmPassword','otp'].forEach(id=>$(id).value='');if(parent===window)location.assign('/shop.html');else send('success');}
function matchingPassword(){const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<8||new TextEncoder().encode(a).length>72)throw Error('Use at least 8 characters and no more than 72 bytes.');if(a!==b)throw Error('Passwords do not match.');return a;}
function updateSteps(id){
 const labels=mode==='register'?['Mobile','Password','Verify OTP','Details']:mode==='reset'?['Mobile','Verify OTP','New password']:['Mobile','Password'];
 const step=mode==='register'?({phoneForm:0,passwordForm:1,securityStep:2,otpForm:2,profileForm:3}[id]??0):mode==='reset'?({phoneForm:0,loginForm:0,securityStep:1,otpForm:1,passwordForm:2}[id]??0):(id==='phoneForm'?0:1);
 $('flowCaption').textContent=(mode==='register'?'Create account':mode==='reset'?'Reset password':'Log in')+' · Step '+(step+1)+' of '+labels.length;
 $('steps').replaceChildren();labels.forEach((label,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+label;li.className=i<step?'done':i===step?'current':'';if(i===step)li.setAttribute('aria-current','step');$('steps').append(li);});
 $('modeTabs').hidden=id!=='phoneForm';$('loginTab').setAttribute('aria-pressed',String(mode!=='register'));$('registerTab').setAttribute('aria-pressed',String(mode==='register'));
 $('phoneContinue').textContent=mode==='register'?'Continue to create password':'Continue to password';
 $('passwordContinue').textContent=mode==='reset'?'Save password & log in':proof?'Continue to your details':'Continue to mobile verification';
 $('otpForm').querySelector('button[type="submit"]').textContent=mode==='reset'?'Verify OTP & set password':'Verify OTP & continue';
 const hints=mode==='register'?{phoneForm:'Next: Create and confirm your password.',passwordForm:proof?'Next: Complete your name and delivery PIN code.':'Next: Verify your mobile number with an OTP.',securityStep:'Next: Enter the OTP sent to your phone.',otpForm:'Next: Add your name and delivery PIN code.',profileForm:'Next: Create your account and continue shopping.'}:mode==='reset'?{securityStep:'Next: Enter the OTP sent to your phone.',otpForm:'Next: Create and confirm a new password.',passwordForm:'Next: Save your password and log in.'}:{phoneForm:'Next: Enter your shopping password.',loginForm:'Next: Log in and continue shopping.'};
 $('nextHint').textContent=hints[id]||'';$('backStep').hidden=['phoneForm','securityStep','otpForm'].includes(id);
 $('passwordMatch').textContent='';$('passwordMatch').className='password-note';
}
function selectMode(value){if(busy)return;mode=value;password='';proof='';request='';show('phoneForm',value==='register'?'Create your account':'Log in to Cerood','Enter your mobile number to continue.');}
$('loginTab').onclick=()=>selectMode('login');$('registerTab').onclick=()=>selectMode('register');
$('backStep').onclick=()=>{if(busy)return;const current=ids.find(id=>!$(id).hidden);if(current==='loginForm'||(current==='passwordForm'&&mode==='register')){show('phoneForm',mode==='register'?'Create your account':'Log in to Cerood','Enter your mobile number to continue.');}else if(current==='profileForm'){show('passwordForm','Create your password','Your mobile number is verified. Confirm your password.');}else if(current==='otpForm'){show('securityStep','Security check','You can request another code when the resend timer finishes.');loadWidget().catch(error);}else if(current==='passwordForm'&&mode==='reset'){mode='login';proof='';show('loginForm','Welcome back','Enter your password to log in.');}else{mode='login';show('loginForm','Welcome back','Enter your password to log in.');}};
function passwordFeedback(){const a=$('newPassword').value,b=$('confirmPassword').value;$('passwordMatch').textContent=!b?'':a===b?'Passwords match.':'Passwords do not match yet.';$('passwordMatch').className='password-note'+(b&&a===b?' match':'');}
$('newPassword').addEventListener('input',passwordFeedback);$('confirmPassword').addEventListener('input',passwordFeedback);
$('phoneForm').onsubmit=e=>{e.preventDefault();if(busy||!$('phoneForm').reportValidity())return;phone=$('phone').value.trim();if(mode==='register'){password='';proof='';$('newPassword').value='';$('confirmPassword').value='';show('passwordForm','Create your password','Choose and confirm a password before mobile verification.');$('newPassword').focus();}else{mode='login';show('loginForm','Welcome back','Enter your password to log in.');$('loginPassword').focus();}};
$('loginForm').onsubmit=e=>{e.preventDefault();if(!$('loginForm').reportValidity())return;task(async()=>finish(await json('/api/customer/login',{phone,password:$('loginPassword').value})));};
$('register').onclick=()=>{if(busy)return;mode='register';proof='';password='';$('newPassword').value='';$('confirmPassword').value='';show('passwordForm','Create a password','Use a secure password for your shopping account.');$('newPassword').focus();};
$('forgot').onclick=()=>{if(busy)return;mode='reset';proof='';password='';show('securityStep','Verify your mobile','Complete the security check to reset your password.');loadWidget().catch(error);};
$('passwordForm').onsubmit=e=>{e.preventDefault();if(!$('passwordForm').reportValidity())return;task(async()=>{password=matchingPassword();if(mode==='reset'){if(!proof)throw Error('Verify your mobile OTP first.');await finish(await json('/api/msg91/reset-password',{phone,password,accessToken:proof}));}else{if(proof){show('profileForm','Your details','Finish setting up your shopping account.');}else{show('securityStep','Security check','Complete the check below, then tap Send OTP.');await loadWidget();}}});};
function call(method,args){return new Promise((resolve,reject)=>{if(typeof window[method]!=='function'){reject(Error('OTP service is loading. Please retry.'));return;}const timeout=setTimeout(()=>reject(Error('OTP service took too long. Please retry.')),45000);const ok=data=>{clearTimeout(timeout);if(data&&String(data.type||'').toLowerCase()==='error')reject(Error('OTP request failed. Please retry.'));else resolve(data);};const fail=()=>{clearTimeout(timeout);reject(Error('OTP could not be completed. Check the code or retry.'));};try{window[method](...args,ok,fail,...(method==='retryOtp'?[request]:[]));}catch(e){clearTimeout(timeout);reject(e);}});}
function reqId(d){if(typeof d==='string')return d;return String(d?.reqId||d?.req_id||d?.requestId||d?.request_id||d?.data?.reqId||d?.data?.req_id||d?.message||'');}function access(d){if(typeof d==='string')return d;return String(d?.accessToken||d?.access_token||d?.['access-token']||d?.data?.accessToken||d?.data?.access_token||d?.data?.['access-token']||d?.message||'');}
$('send').onclick=()=>task(async()=>{if(Date.now()<deadline)throw Error('Please wait before requesting another OTP.');await loadWidget();if(typeof window.isCaptchaVerified!=='function'||!window.isCaptchaVerified())throw Error('Complete the security check before sending OTP.');const d=await call('sendOtp',['91'+phone]);request=reqId(d);if(!request)throw Error('OTP request could not be started.');proof='';$('otp').value='';show('otpForm','Check your phone','Enter the verification code sent to your number.');cooldown();$('otp').focus();});
$('resend').onclick=()=>{if(Date.now()<deadline||!request)return;task(async()=>{const d=await call('retryOtp',[null]);request=reqId(d)||request;proof='';$('otp').value='';cooldown();$('otp').focus();});};
$('otpForm').onsubmit=e=>{e.preventDefault();if(!$('otpForm').reportValidity())return;task(async()=>{proof=access(await call('verifyOtp',[$('otp').value.trim()]));if(!proof)throw Error('OTP verification failed. Request a new OTP.');if(mode==='reset'){show('passwordForm','Create a new password','Enter and confirm your new shopping password.');$('newPassword').value='';$('confirmPassword').value='';$('newPassword').focus();}else{show('profileForm','Your details','Finish setting up your shopping account.');$('name').focus();}});};
$('profileForm').onsubmit=e=>{e.preventDefault();if(!$('profileForm').reportValidity())return;task(async()=>{if(!proof||!password)throw Error('Please restart mobile verification.');await finish(await json('/api/msg91/complete-registration',{phone,password,accessToken:proof,name:$('name').value.trim(),email:$('email').value.trim(),pincode:$('pincode').value.trim()}));});};
$('change').onclick=()=>{if(busy)return;mode='login';password='';proof='';request='';['loginPassword','newPassword','confirmPassword','otp'].forEach(id=>$(id).value='');show('phoneForm','Log in or sign up','Enter your mobile number to continue.');$('phone').focus();};
$('close').onclick=()=>send('close');$('overlay').onclick=e=>{if(e.target===$('overlay'))send('close');};document.addEventListener('keydown',e=>{if(e.key==='Escape')send('close');});document.querySelectorAll('[data-eye]').forEach(button=>button.onclick=()=>{const input=$(button.dataset.eye),showing=input.type==='password';input.type=showing?'text':'password';button.textContent=showing?'Hide':'Show';button.setAttribute('aria-label',(showing?'Hide ':'Show ')+'password');button.setAttribute('aria-pressed',String(showing));});
function loadWidget(){if(loader)return loader;loader=new Promise((resolve,reject)=>{const urls=['https://verify.msg91.com/otp-provider.js','https://verify.phone91.com/otp-provider.js'];function load(i){const script=document.createElement('script');script.src=urls[i];script.async=true;script.onerror=()=>{if(i+1<urls.length)load(i+1);else{loader=null;reject(Error('Could not load OTP. Please retry.'));}};script.onload=()=>{try{if(typeof window.initSendOTP!=='function')throw Error('OTP widget unavailable.');window.initSendOTP({widgetId:'366965657347303138353039',tokenAuth:'567815T0OZZpNFK06a9ba743P1',exposeMethods:true,captchaRenderId:'captcha',success:()=>{},failure:()=>error(Error('Security verification failed. Please retry.'))});resolve();}catch(e){loader=null;reject(e);}};document.head.append(script);}load(0);});return loader;}
show('phoneForm','Log in to Cerood','Enter your mobile number to continue.');
const viewport=window.visualViewport;function resize(){document.documentElement.style.setProperty('--view-height',(viewport?.height||innerHeight)+'px');}viewport?.addEventListener('resize',resize);resize();document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.source!=='cerood-auth-parent')return;error(Error(event.data.message||'Please sign in again.'));});
})();
</script></body></html>
