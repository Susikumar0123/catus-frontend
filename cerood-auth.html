
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Cerood Account</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: transparent;
            color: #171923;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(13, 17, 31, .65);
        }

        .panel {
            width: min(780px, 100%);
            min-height: 440px;
            display: grid;
            grid-template-columns: 36% 64%;
            background: #fff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 90px #0004;
        }

        .side {
            background: linear-gradient(
                145deg,
                #191c35,
                #715b96
            );

            color: #fff;
            padding: 48px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .side img {
            width: 100px;
            max-height: 75px;
            object-fit: contain;
            align-self: flex-start;
        }

        .side h1 {
            font-size: 29px;
            line-height: 1.2;
        }

        .side p {
            font-size: 13px;
            line-height: 1.7;
            color: #e9e2ff;
        }

        .main {
            padding: 44px 42px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 15px;
            border: 0;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            background: #f1f2f5;
            cursor: pointer;
            font-size: 23px;
        }

        .main h2 {
            font-size: 24px;
            margin: 0 0 8px;
        }

        .sub {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        .field {
            display: block;
            margin: 17px 0 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .input {
            width: 100%;
            height: 48px;
            border: 1px solid #dfe2ea;
            background: #f8f9fc;
            border-radius: 10px;
            padding: 0 13px;
            font: inherit;
            font-size: 14px;
        }

        .input:focus {
            outline: 2px solid #b7a5ed;
        }

        .submit {
            margin-top: 23px;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            background: #24203c;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:disabled {
            opacity: .6;
            cursor: wait;
        }

        .status {
            min-height: 20px;
            font-size: 12px;
            line-height: 1.5;
            color: #b91c1c;
            margin-top: 12px;
        }

        .status.ok {
            color: #166534;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
            margin-top: 17px;
        }

        .hint a {
            color: #6045a0;
            font-weight: 600;
        }

        .forgot-row {
            text-align: right;
            margin-top: 11px;
        }

        .forgot-row a {
            font-size: 12px;
            font-weight: 600;
            color: #6045a0;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #b7a5ed;
            outline-offset: 3px;
        }

        @media (max-width: 650px) {
            .overlay {
                align-items: end;
                padding: 0;
            }

            .panel {
                width: 100%;
                min-height: 0;
                max-height: 94dvh;
                overflow: auto;
                display: block;
                border-radius: 22px 22px 0 0;
            }

            .side {
                display: none;
            }

            .main {
                padding:
                    53px 24px
                    max(30px, env(safe-area-inset-bottom));
            }
        }
    </style>

</head>

<body>

    <div class="overlay" id="overlay">

        <section
            class="panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="title"
        >

            <aside class="side">

                <img
                    src="/cerood-logo.webp"
                    alt="Cerood"
                >

                <h1>
                    Welcome to Cerood
                </h1>

                <p>
                    One account for your Cerood shopping,
                    home services and Renewed orders.
                </p>

            </aside>

            <main class="main">

                <button
                    type="button"
                    class="close"
                    id="close"
                    aria-label="Close"
                >
                    &times;
                </button>

                <h2 id="title">
                    Login to Cerood
                </h2>

                <p class="sub">
                    Use your registered mobile number
                    and password.
                </p>

                <form id="login">

                    <label
                        class="field"
                        for="phone"
                    >
                        Mobile number
                    </label>

                    <input
                        class="input"
                        id="phone"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="10"
                        placeholder="10-digit mobile number"
                        required
                        pattern="[6-9][0-9]{9}"
                    >

                    <label
                        class="field"
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        class="input"
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="Enter password"
                    >

                    <div class="forgot-row">

                        <a
                            href="#"
                            id="ceroodForgotPassword"
                        >
                            Forgot Password?
                        </a>

                    </div>

                    <button
                        class="submit"
                        id="submit"
                        type="submit"
                    >
                        Login
                    </button>

                </form>

                <p
                    class="status"
                    id="status"
                    role="status"
                    aria-live="polite"
                ></p>

                <p class="hint">

                    New to Cerood?

                    <a
                        href="#"
                        id="ceroodCreateAccount"
                    >
                        Create an account
                    </a>

                </p>

            </main>

        </section>

    </div>

    <script>
        'use strict';

        const API =
            'https://catus-backend-d2js.onrender.com';

        const send = (type, extra = {}) => {

            if (window.parent === window) {
                return;
            }

            parent.postMessage(
                {
                    source: 'cerood-auth-frame',
                    type,
                    ...extra
                },
                location.origin
            );

        };

        const statusElement =
            document.getElementById('status');

        const submitButton =
            document.getElementById('submit');

        function showStatus(message, success = false) {

            statusElement.textContent = message;

            statusElement.className =
                success ? 'status ok' : 'status';

        }

        // ==========================================
        // CLOSE POPUP
        // ==========================================

        document
            .getElementById('close')
            .addEventListener('click', () => {

                send('close');

            });

        document
            .getElementById('overlay')
            .addEventListener('click', event => {

                if (event.target.id === 'overlay') {

                    send('close');

                }

            });

        document.addEventListener(
            'keydown',
            event => {

                if (event.key === 'Escape') {

                    send('close');

                }

            }
        );

        // ==========================================
        // CREATE ACCOUNT
        // ==========================================

        document
            .getElementById('ceroodCreateAccount')
            .addEventListener('click', event => {

                event.preventDefault();

                send('register', { phone: document.getElementById('phone').value.trim() });

            });

        // ==========================================
        // FORGOT PASSWORD
        // ==========================================

        document
            .getElementById('ceroodForgotPassword')
            .addEventListener('click', event => {

                event.preventDefault();

                send('forgot', { phone: document.getElementById('phone').value.trim() });

            });

        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById('login')
            .addEventListener(
                'submit',
                async event => {

                    event.preventDefault();

                    const phone =
                        document
                            .getElementById('phone')
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById('password')
                            .value;

                    if (!/^[6-9]\d{9}$/.test(phone)) {

                        showStatus(
                            'Enter a valid 10-digit mobile number.'
                        );

                        return;

                    }

                    if (!password) {

                        showStatus(
                            'Please enter your password.'
                        );

                        return;

                    }

                    submitButton.disabled = true;

                    showStatus(
                        'Checking your account…'
                    );

                    try {

                        const response = await fetch(
                            API + '/api/login-password',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body: JSON.stringify({
                                    phone,
                                    password
                                })
                            }
                        );

                        const data =
                            await response.json();

                        if (
                            !response.ok ||
                            !data.success ||
                            !data.renewed_session
                        ) {

                            throw new Error(
                                data.message ||
                                'Login could not be completed.'
                            );

                        }

                        const user = data.user || {};

                        const safeUser = {

                            id: user.id,

                            name: user.name,

                            email: user.email,

                            phone: user.phone,

                            pincode: user.pincode,

                            address: user.address,

                            wallet: user.wallet

                        };

                        localStorage.setItem(
                            'catus_logged_user',
                            JSON.stringify(safeUser)
                        );

                        localStorage.setItem(
                            'cerood_renewed_customer_session',
                            data.renewed_session
                        );

                        showStatus(
                            'Login successful!',
                            true
                        );

                        send(
                            'success',
                            {
                                user: safeUser
                            }
                        );

                    } catch (error) {

                        showStatus(
                            error.message ||
                            'Unable to connect. Please try again.'
                        );

                    } finally {

                        submitButton.disabled = false;

                    }

                }
            );

    </script>

</body>

</html>
