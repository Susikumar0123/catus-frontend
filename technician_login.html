<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cerood Technician Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .brand span {
            color: #0284c7;
        }

        h1 {
            margin: 24px 0 6px;
            font-size: 22px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #0284c7;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .link-btn {
            margin-top: 14px;
            background: transparent;
            color: #0284c7;
            padding: 8px;
        }

        .link-btn:hover {
            background: #f0f9ff;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        CER<span>OOD</span>
    </div>

    <h1>Technician Partner Login</h1>

    <div class="subtitle">
        Login to manage your assigned Cerood service orders.
    </div>

    <form id="technicianLoginForm">

        <div class="field">
            <label>Mobile Number</label>

            <input
                id="techPhone"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10 digit mobile number"
                required
            >
        </div>

        <div class="field">
            <label>Password</label>

            <input
                id="techPassword"
                type="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button
            id="loginBtn"
            type="submit"
        >
            Login
        </button>

        <button
            type="button"
            class="link-btn"
            onclick="startPasswordSetup()"
        >
            Create / Reset Password
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </form>

</div>


<script>

const API_BASE_URL =
    window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : 'https://catus-backend-d2js.onrender.com';


const form =
    document.getElementById('technicianLoginForm');

const loginBtn =
    document.getElementById('loginBtn');

const messageBox =
    document.getElementById('loginMessage');


function cleanPhone(value) {
    return String(value || '')
        .replace(/\D/g, '')
        .slice(-10);
}


function showMessage(text, type = 'error') {

    messageBox.className =
        `message ${type}`;

    messageBox.textContent =
        text;

    messageBox.style.display =
        'block';
}


form.addEventListener(
    'submit',
    async function (event) {

        event.preventDefault();

        const phone =
            cleanPhone(
                document.getElementById('techPhone').value
            );

        const password =
            document.getElementById('techPassword').value;

        if (!/^[6-9]\d{9}$/.test(phone)) {

            showMessage(
                'Enter a valid 10 digit mobile number.'
            );

            return;
        }

        if (!password) {

            showMessage(
                'Enter your password.'
            );

            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        messageBox.style.display = 'none';

        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/technicians/login`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            phone,
                            password
                        })
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success
            ) {

                if (
                    data.code ===
                    'PASSWORD_NOT_SET'
                ) {

                    showMessage(
                        'Password not created yet. Click Create / Reset Password.'
                    );

                    return;
                }

                showMessage(
                    data.message ||
                    'Login failed.'
                );

                return;
            }


            localStorage.setItem(
    'cerood_technician_token',
    data.token
);

localStorage.setItem(
    'cerood_technician',
    JSON.stringify(
        data.technician
    )
);


            showMessage(
                'Login successful.',
                'success'
            );


            setTimeout(() => {

                window.location.href =
                    'technician_dashboard.html';

            }, 500);

        } catch (error) {

            console.error(
                'Technician Login Error:',
                error
            );

            showMessage(
                'Unable to connect to server.'
            );

        } finally {

            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    }
);


function startPasswordSetup() {

    const phone =
        cleanPhone(
            document.getElementById('techPhone').value
        );

    if (!/^[6-9]\d{9}$/.test(phone)) {

        showMessage(
            'First enter your registered mobile number.'
        );

        return;
    }


    sessionStorage.setItem(
        'cerood_technician_password_phone',
        phone
    );


    window.location.href =
        'technician_set_password.html';
}

</script>

</body>
</html>
