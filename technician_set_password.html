<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Technician Password | Cerood</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 24px;
        }

        .brand span {
            color: #0284c7;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2,132,199,.10);
        }

        input:disabled {
            background: #f1f5f9;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #0284c7;
            color: white;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .secondary {
            background: transparent;
            color: #0284c7;
            margin-top: 10px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 8px;
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .success {
            display: block;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        #msg91Captcha {
            margin: 12px 0 16px;
            min-height: 1px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="brand">
        CER<span>OOD</span>
    </div>

    <h1>Create / Reset Password</h1>

    <div class="subtitle">
        Verify your registered technician mobile number before creating a password.
    </div>


    <!-- STEP 1 -->
    <div id="stepPhone" class="step active">

        <div class="field">
            <label>Registered Mobile Number</label>

            <input
                id="phone"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10 digit mobile number"
            >
        </div>

        <div id="msg91Captcha"></div>

        <button
            id="sendOtpBtn"
            type="button"
            onclick="sendTechnicianOtp()"
        >
            Send OTP
        </button>

    </div>


    <!-- STEP 2 -->
    <div id="stepOtp" class="step">

        <div class="field">
            <label>Enter OTP</label>

            <input
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter OTP"
            >
        </div>

        <button
            id="verifyOtpBtn"
            type="button"
            onclick="verifyTechnicianOtp()"
        >
            Verify OTP
        </button>

        <button
            type="button"
            class="secondary"
            onclick="backToPhone()"
        >
            Change Mobile Number
        </button>

    </div>


    <!-- STEP 3 -->
    <div id="stepPassword" class="step">

        <div class="field">
            <label>New Password</label>

            <input
                id="newPassword"
                type="password"
                placeholder="Minimum 6 characters"
            >
        </div>

        <div class="field">
            <label>Confirm Password</label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Re-enter password"
            >
        </div>

        <button
            id="savePasswordBtn"
            type="button"
            onclick="saveTechnicianPassword()"
        >
            Save Password
        </button>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <button
        type="button"
        class="secondary"
        onclick="goLogin()"
    >
        Back to Technician Login
    </button>

</div>


<script>

const API_BASE_URL =
    window.location.hostname === 'localhost'
        ? 'http://localhost:3000'
        : 'https://catus-backend-d2js.onrender.com';


const MSG91_WIDGET_ID =
    '366965657347303138353039';

const MSG91_WIDGET_TOKEN =
    '567815T0OZZpNFK06a9ba743P1';


let technicianPhone = '';

let msg91ReqId = '';

let msg91AccessToken = '';

let msg91LoadPromise = null;


// ==========================================
// MSG91 CONFIG
// ==========================================

const msg91Configuration = {

    widgetId: MSG91_WIDGET_ID,

    tokenAuth: MSG91_WIDGET_TOKEN,

    exposeMethods: true,

    captchaRenderId: 'msg91Captcha',

    success: function (data) {

        console.log(
            'MSG91 Technician Success:',
            data
        );
    },

    failure: function (error) {

        console.error(
            'MSG91 Technician Failure:',
            error
        );
    }
};


// ==========================================
// LOAD MSG91 ONLY WHEN NEEDED
// ==========================================

function loadMsg91() {

    if (
        typeof window.sendOtp === 'function' &&
        typeof window.verifyOtp === 'function'
    ) {
        return Promise.resolve();
    }

    if (msg91LoadPromise) {
        return msg91LoadPromise;
    }

    msg91LoadPromise =
        new Promise((resolve, reject) => {

            const script =
                document.createElement('script');

            script.src =
                'https://verify.msg91.com/otp-provider.js';

            script.async = true;

            script.onload = () => {

                try {

                    if (
                        typeof window.initSendOTP !==
                        'function'
                    ) {
                        throw new Error(
                            'MSG91 initSendOTP not available'
                        );
                    }

                    window.initSendOTP(
                        msg91Configuration
                    );

                    resolve();

                } catch (error) {

                    msg91LoadPromise = null;

                    reject(error);
                }
            };

            script.onerror = () => {

                msg91LoadPromise = null;

                reject(
                    new Error(
                        'MSG91 script failed to load'
                    )
                );
            };

            document.head.appendChild(
                script
            );
        });

    return msg91LoadPromise;
}


// ==========================================
// WAIT FOR CAPTCHA
// ==========================================

async function waitForMsg91Captcha() {

    const initStartedAt = Date.now();

    while (
        (
            typeof window.isCaptchaVerified !==
                'function' ||
            typeof window.sendOtp !==
                'function'
        ) &&
        Date.now() - initStartedAt < 10000
    ) {

        await new Promise(
            resolve =>
                setTimeout(resolve, 100)
        );
    }

    if (
        typeof window.isCaptchaVerified !==
            'function' ||
        typeof window.sendOtp !==
            'function'
    ) {

        throw new Error(
            'MSG91 captcha did not initialize'
        );
    }


    const startedAt = Date.now();

    while (
        Date.now() - startedAt <
        120000
    ) {

        try {

            if (
                window.isCaptchaVerified() ===
                true
            ) {
                return;
            }

        } catch (error) {

            console.log(
                'Captcha status waiting...'
            );
        }

        await new Promise(
            resolve =>
                setTimeout(resolve, 500)
        );
    }

    throw new Error(
        'Captcha verification timeout'
    );
}


// ==========================================
// HELPERS
// ==========================================

function cleanPhone(value) {

    return String(value || '')
        .replace(/\D/g, '')
        .slice(-10);
}


function getMsg91ReqId(data) {

    return String(
        data?.reqId ||
        data?.requestId ||
        data?.request_id ||
        data?.data?.reqId ||
        data?.data?.requestId ||
        data?.data?.request_id ||
        ''
    ).trim();
}


function getMsg91AccessToken(data) {

    return String(
        data?.accessToken ||
        data?.access_token ||
        data?.['access-token'] ||
        data?.data?.accessToken ||
        data?.data?.access_token ||
        data?.data?.['access-token'] ||
        ''
    ).trim();
}


function showStep(step) {

    document
        .querySelectorAll('.step')
        .forEach(el => {
            el.classList.remove('active');
        });

    document
        .getElementById(step)
        .classList.add('active');
}


function showMessage(
    text,
    type = 'error'
) {

    const box =
        document.getElementById(
            'message'
        );

    box.className =
        `message ${type}`;

    box.textContent =
        text;
}


function clearMessage() {

    const box =
        document.getElementById(
            'message'
        );

    box.style.display = 'none';

    box.className = 'message';
}


// ==========================================
// SEND OTP
// ==========================================

async function sendTechnicianOtp() {

    clearMessage();

    technicianPhone =
        cleanPhone(
            document.getElementById(
                'phone'
            ).value
        );


    if (
        !/^[6-9]\d{9}$/.test(
            technicianPhone
        )
    ) {

        showMessage(
            'Enter a valid registered mobile number.'
        );

        return;
    }


    const button =
        document.getElementById(
            'sendOtpBtn'
        );

    button.disabled = true;

    button.textContent =
        'Preparing OTP...';


    try {

        await loadMsg91();

        await waitForMsg91Captcha();


        if (
            typeof window.sendOtp !==
            'function'
        ) {

            throw new Error(
                'OTP service unavailable'
            );
        }


        button.textContent =
            'Sending OTP...';


        window.sendOtp(

            `91${technicianPhone}`,

            function (data) {

                console.log(
                    'Technician OTP Sent:',
                    data
                );


                msg91ReqId =
                    getMsg91ReqId(data);


                if (!msg91ReqId) {

                    showMessage(
                        'OTP session could not be created. Please try again.'
                    );

                    button.disabled = false;

                    button.textContent =
                        'Send OTP';

                    return;
                }


                msg91AccessToken = '';


                showStep(
                    'stepOtp'
                );


                showMessage(
                    `OTP sent to +91 ${technicianPhone}`,
                    'success'
                );


                button.disabled = false;

                button.textContent =
                    'Send OTP';
            },

            function (error) {

                console.error(
                    'Technician Send OTP Error:',
                    error
                );


                showMessage(
                    'Unable to send OTP. Please try again.'
                );


                button.disabled = false;

                button.textContent =
                    'Send OTP';
            }
        );

    } catch (error) {

        console.error(
            'MSG91 Technician Load Error:',
            error
        );


        showMessage(
            'Complete captcha and try again.'
        );


        button.disabled = false;

        button.textContent =
            'Send OTP';
    }
}


// ==========================================
// VERIFY OTP
// ==========================================

function verifyTechnicianOtp() {

    clearMessage();


    const otp =
        String(
            document.getElementById(
                'otp'
            ).value || ''
        ).trim();


    if (!otp) {

        showMessage(
            'Enter the OTP.'
        );

        return;
    }


    if (!msg91ReqId) {

        showMessage(
            'OTP session expired. Please request OTP again.'
        );

        return;
    }


    if (
        typeof window.verifyOtp !==
        'function'
    ) {

        showMessage(
            'OTP service is loading. Please try again.'
        );

        return;
    }


    const button =
        document.getElementById(
            'verifyOtpBtn'
        );

    button.disabled = true;

    button.textContent =
        'Verifying...';


    window.verifyOtp(

        otp,

        function (data) {

            console.log(
                'Technician OTP Verified:',
                data
            );


            msg91AccessToken =
                getMsg91AccessToken(data);


            if (!msg91AccessToken) {

                showMessage(
                    'OTP verification token missing. Please try again.'
                );

                button.disabled = false;

                button.textContent =
                    'Verify OTP';

                return;
            }


            showStep(
                'stepPassword'
            );


            showMessage(
                'Mobile number verified successfully.',
                'success'
            );


            button.disabled = false;

            button.textContent =
                'Verify OTP';
        },

        function (error) {

            console.error(
                'Technician OTP Verify Error:',
                error
            );


            showMessage(
                'Incorrect OTP. Please try again.'
            );


            button.disabled = false;

            button.textContent =
                'Verify OTP';
        },

        msg91ReqId
    );
}


// ==========================================
// SAVE PASSWORD
// ==========================================

async function saveTechnicianPassword() {

    clearMessage();


    if (
        !msg91AccessToken ||
        !technicianPhone
    ) {

        showMessage(
            'Please verify your mobile number first.'
        );

        return;
    }


    const password =
        document.getElementById(
            'newPassword'
        ).value;


    const confirmPassword =
        document.getElementById(
            'confirmPassword'
        ).value;


    if (
        !password ||
        password.length < 6
    ) {

        showMessage(
            'Password must be at least 6 characters.'
        );

        return;
    }


    if (
        password !==
        confirmPassword
    ) {

        showMessage(
            'Passwords do not match.'
        );

        return;
    }


    const button =
        document.getElementById(
            'savePasswordBtn'
        );


    button.disabled = true;

    button.textContent =
        'Saving...';


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/technicians/set-password`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            accessToken:
                                msg91AccessToken,

                            phone:
                                technicianPhone,

                            password
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                data.message ||
                'Unable to create password.'
            );

            return;
        }


        showMessage(
            'Password created successfully. Redirecting to login...',
            'success'
        );


        sessionStorage.removeItem(
            'cerood_technician_password_phone'
        );


        setTimeout(() => {

            window.location.href =
                'technician_login.html';

        }, 1200);


    } catch (error) {

        console.error(
            'Technician Password Save Error:',
            error
        );


        showMessage(
            'Unable to connect to server.'
        );

    } finally {

        button.disabled = false;

        button.textContent =
            'Save Password';
    }
}


// ==========================================
// NAVIGATION
// ==========================================

function backToPhone() {

    msg91ReqId = '';

    msg91AccessToken = '';

    document.getElementById(
        'otp'
    ).value = '';

    showStep(
        'stepPhone'
    );

    clearMessage();
}


function goLogin() {

    window.location.href =
        'technician_login.html';
}


// ==========================================
// PREFILL PHONE FROM LOGIN PAGE
// ==========================================

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const savedPhone =
            cleanPhone(
                sessionStorage.getItem(
                    'cerood_technician_password_phone'
                )
            );


        if (
            /^[6-9]\d{9}$/.test(
                savedPhone
            )
        ) {

            technicianPhone =
                savedPhone;


            document.getElementById(
                'phone'
            ).value =
                savedPhone;
        }
    }
);

</script>

</body>
</html>
