<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cerood | Technician Schedule</title><style>
*{box-sizing:border-box}body{font:14px system-ui,Arial;margin:0;background:#fff;color:#111827}header{border-bottom:1px solid #e5e7eb;padding:18px max(16px,calc((100vw - 1100px)/2))}h1{font-size:23px;margin:0}main{max-width:1100px;margin:auto;padding:22px 16px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}label{display:block;font-weight:600;margin-bottom:6px}input,button{font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}button{cursor:pointer;background:#111827;color:#fff;border-color:#111827}button:disabled{opacity:.5}.note{color:#64748b;line-height:1.6}.error{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.slot{border:1px solid #e5e7eb;border-radius:10px;padding:14px;min-height:160px}.slot h2{font-size:16px;margin:0 0 12px}.booking{padding:10px 0;border-top:1px solid #f1f5f9;overflow-wrap:anywhere}.booking strong{display:block}.muted{color:#64748b}.warn{color:#b91c1c;font-weight:700}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Cerood · Technician Schedule</h1></header><main><p class="note">Read-only calendar for confirmed Home Services appointments. Unassigned bookings are shown separately. Availability and travel time must be verified before confirmation.</p><div class="toolbar"><div><label for="date">Appointment date</label><input id="date" type="date"></div><button id="load">Load schedule</button><button id="refresh">Refresh</button></div><p id="message" role="status"></p><div id="summary"></div><div id="slots" class="grid"></div></main><script>
'use strict';
const API='https://catus-backend-d2js.onrender.com';
const windows=['08:00-10:00','10:00-12:00','12:00-14:00','14:00-16:00','16:00-18:00','18:00-20:00'];
const el=id=>document.getElementById(id);
const token=()=>sessionStorage.getItem('adminToken')||sessionStorage.getItem('cerood_admin_token')||localStorage.getItem('adminToken')||localStorage.getItem('cerood_admin_token')||'';
function todayIST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function node(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e;}
async function load(){const date=el('date').value;const t=token();el('message').textContent='';el('slots').replaceChildren();el('summary').replaceChildren();if(!date){el('message').textContent='Select a date.';return;}if(!t){el('message').textContent='Admin session missing. Log in to Cerood Admin first, in this browser tab.';return;}
el('load').disabled=true;try{const r=await fetch(API+'/api/admin/home-services/technician-schedule?date='+encodeURIComponent(date),{headers:{Authorization:'Bearer '+t,Accept:'application/json'},cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Schedule unavailable');const rows=d.appointments||[];const conflicts=rows.filter(x=>x.conflict).length;el('summary').append(node('p',rows.length+' confirmed appointment(s) · '+rows.filter(x=>!x.technician_id).length+' unassigned · '+conflicts+' conflict row(s)',conflicts?'warn':'note'));
for(const w of windows){const box=node('section','', 'slot');box.append(node('h2',w));const matches=rows.filter(x=>x.appointment_window===w);if(!matches.length)box.append(node('p','No confirmed appointments','muted'));for(const a of matches){const b=node('div','', 'booking');b.append(node('strong',a.service_name));b.append(node('div','Technician: '+(a.technician_id||'Not assigned'),a.technician_id?'':'warn'));b.append(node('div','Booking: '+a.order_id,'muted'));b.append(node('div','Status: '+(a.status||'Pending'),'muted'));if(a.conflict)b.append(node('div','CONFLICT — duplicate slot','warn'));box.append(b);}el('slots').append(box);}
}catch(e){el('message').textContent=e.message;el('message').className='error';}finally{el('load').disabled=false;}}
el('date').value=todayIST();el('load').addEventListener('click',load);el('refresh').addEventListener('click',load);load();
</script></body></html>
