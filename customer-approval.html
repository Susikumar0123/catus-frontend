<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cerood · Booking Approval</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#fff;color:#171717}main{max-width:640px;margin:40px auto;padding:20px}h1{font-size:25px}label{display:block;margin:18px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:6px}button{background:#171717;color:#fff;border:0;padding:12px 16px;border-radius:6px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}section{border-top:1px solid #ddd;margin-top:20px;padding-top:15px}p{line-height:1.6}#message{white-space:pre-wrap}</style></head><body><main><h1>Cerood Home Services</h1><p>Booking request is free. Inspection/visiting is paid. Repair starts only after you accept the quotation.</p><label for="order">Booking ID</label><input id="order" autocomplete="off" placeholder="CHS-..."><label for="key">Private approval key</label><input id="key" type="password" autocomplete="off" placeholder="Key shown when you booked"><button id="load">Check booking</button><p id="message" role="status"></p><section id="details" hidden><h2 id="service"></h2><p id="inspection"></p><div id="inspectionActions" hidden><button id="acceptInspection">Accept inspection charge</button><button id="rejectInspection">Decline inspection charge</button></div><p id="quote"></p><div id="quoteActions" hidden><button id="acceptQuote">Accept repair quotation</button><button id="rejectQuote">Reject repair quotation</button></div><section id="paymentSection" hidden><h2>Repair payment</h2><p id="paymentDetails"></p><p>Inspection/visiting charges are separate and are not included in this payment.</p><button id="payRepair" type="button" hidden>Pay approved repair amount</button><button id="refreshPayment" type="button">Refresh payment status</button><p id="paymentMessage" role="status"></p></section></section></main><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
(function(){'use strict';const base='https://catus-backend-d2js.onrender.com';const $=id=>document.getElementById(id);const msg=$('message');const request=async(path,extra={})=>{const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:$('order').value.trim(),customer_approval_key:$('key').value.trim(),...extra})});const data=await r.json();if(!r.ok||!data.success)throw Error(data.message||'Request failed');return data};const money=v=>v==null?'Not set':'₹'+Number(v).toFixed(2);async function load(){msg.textContent='Loading...';$('details').hidden=true;try{const {booking:b}=await request('/api/home-services/booking-status');$('details').hidden=false;$('service').textContent=b.service_name||'Home Service';$('inspection').textContent='Inspection charge: '+money(b.inspection_fee)+' · '+(b.inspection_fee_status||'Pending');$('inspectionActions').hidden=!(b.inspection_fee!=null&&b.inspection_fee_status==='Awaiting Customer Confirmation');$('quote').textContent='Repair quotation: '+money(b.repair_quote_amount)+' · '+(b.repair_quote_status||'Not quoted')+(b.repair_quote_notes?' · '+b.repair_quote_notes:'');$('quoteActions').hidden=!(b.repair_quote_status==='Sent');msg.textContent='';await refreshPayment();}catch(e){msg.textContent=e.message;}}async function respond(path,decision){if(!confirm('Confirm your decision: '+decision+'?'))return;msg.textContent='Saving response...';try{await request(path,{decision});await load();msg.textContent='Your response was saved.'}catch(e){msg.textContent=e.message}}let paymentBusy=false;
async function refreshPayment(){const section=$('paymentSection'),details=$('paymentDetails'),pay=$('payRepair'),status=$('paymentMessage');section.hidden=false;pay.hidden=true;try{const b=await request('/api/home-services/payment-readiness');const st=String(b.payment_status||'not_started');details.textContent=st==='paid'?'Repair payment: Paid':(b.ready_for_payment?'Approved repair amount: '+money(b.approved_repair_amount)+' · Status: '+st:'Repair payment unavailable until inspection and quotation approval.');pay.hidden=!(b.ready_for_payment&&st!=='paid');if(st==='paid')status.textContent='Payment confirmed.';else if(st==='pending')status.textContent='An existing payment may be pending. Check your payment status before paying again.';else status.textContent='';}catch(e){section.hidden=true;status.textContent=e.message;}}
async function payRepair(){if(paymentBusy)return;const status=$('paymentMessage'),button=$('payRepair');if(!window.Razorpay){status.textContent='Payment gateway could not load. Please try later.';return;}if(!confirm('Pay only the approved repair quotation? Inspection fee is separate.'))return;paymentBusy=true;button.disabled=true;status.textContent='Preparing secure payment...';try{const d=await request('/api/home-services/create-repair-payment');if(d.already_paid){status.textContent='Payment already recorded.';await refreshPayment();return;}if(!d.razorpay_order_id||!d.key_id||!Number.isSafeInteger(Number(d.amount))||Number(d.amount)<100)throw Error('Invalid payment details. Contact Cerood support.');const options={key:d.key_id,amount:d.amount,currency:'INR',name:'Cerood Home Services',description:'Approved repair quotation (inspection separate)',order_id:d.razorpay_order_id,handler:async function(r){status.textContent='Payment received by gateway. Verifying with Cerood...';try{const v=await request('/api/home-services/verify-repair-payment',{razorpay_order_id:r.razorpay_order_id,razorpay_payment_id:r.razorpay_payment_id,razorpay_signature:r.razorpay_signature});status.textContent=v.payment_status==='paid'?'Repair payment verified successfully.':'Payment under review. Do not pay again.';}catch(e){status.textContent='Payment verification pending. Do not pay again. Contact Cerood with your booking ID.';}await refreshPayment();},modal:{ondismiss:function(){status.textContent='Payment window closed. If you paid, refresh status before trying again.';}}};const checkout=new window.Razorpay(options);checkout.on('payment.failed',function(){status.textContent='Payment was not completed. Refresh payment status before retrying.';});checkout.open();}catch(e){status.textContent=e.message;}finally{paymentBusy=false;button.disabled=false;}}
$('payRepair').onclick=payRepair;$('refreshPayment').onclick=refreshPayment;
$('load').onclick=load;$('acceptInspection').onclick=()=>respond('/api/home-services/inspection-response','accept');$('rejectInspection').onclick=()=>respond('/api/home-services/inspection-response','reject');$('acceptQuote').onclick=()=>respond('/api/home-services/quotation-response','accept');$('rejectQuote').onclick=()=>respond('/api/home-services/quotation-response','reject');})();
</script></body></html>
