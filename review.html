<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rate Your Service | Cerood</title>

    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f6f7f9;
            color: #111827;
        }

        .review-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .review-card {
            width: 100%;
            max-width: 480px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            padding: 28px 22px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .brand {
            text-align: center;

            font-size: 25px;
            font-weight: 800;

            margin-bottom: 6px;
        }

        .brand span {
            color: #6d4aff;
        }

        .title {
            text-align: center;

            margin: 18px 0 6px;

            font-size: 22px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;
            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 22px;
        }

        .service-card {
    display: flex;
    gap: 16px;
    align-items: flex-start;

    padding: 15px;

    margin-bottom: 22px;

    background: #f8fafc;

    border: 1px solid #e5e7eb;
    border-radius: 14px;
}

.product-image {
    width: 90px;
    height: 90px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 10px;

    background: #ffffff;

    border: 1px solid #e5e7eb;

    display: none;
}

.service-info {
    flex: 1;
    min-width: 0;
}

.product-name {
    font-size: 16px;
    font-weight: 700;

    color: #111827;

    line-height: 1.35;

    margin-bottom: 7px;
}

.service-order-id {
    font-size: 13px;
    color: #64748b;

    margin-bottom: 7px;
}

.service-status {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 12px;
    font-weight: 700;

    background: #f1f5f9;
    color: #475569;
}

.service-status.completed {
    background: #dcfce7;
    color: #166534;
}

.service-status.pending {
    background: #e0f2fe;
    color: #0369a1;
}

.service-extra {
    margin-top: 10px;

    font-size: 12px;
    color: #64748b;

    line-height: 1.6;
}

@media (max-width: 520px) {

    .product-image {
        width: 78px;
        height: 78px;
    }

    .product-name {
        font-size: 15px;
    }
}

        .order-box {
            background: #f8fafc;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            padding: 13px 15px;

            margin-bottom: 22px;
        }

        .order-label {
            font-size: 12px;
            color: #64748b;

            margin-bottom: 4px;
        }

        .order-number {
            font-size: 15px;
            font-weight: 700;
        }

        .field-label {
            display: block;

            font-size: 14px;
            font-weight: 700;

            margin-bottom: 9px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;

            margin: 5px 0 24px;
        }

        .star {
            border: 0;
            background: transparent;

            padding: 0;

            font-size: 42px;
            line-height: 1;

            color: #d1d5db;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                color 0.15s ease;
        }

        .star:hover {
            transform: scale(1.08);
        }

        .star.active {
            color: #f59e0b;
        }

        .rating-text {
            text-align: center;

            min-height: 20px;

            font-size: 13px;
            font-weight: 600;

            color: #64748b;

            margin-top: -14px;
            margin-bottom: 20px;
        }

        .input {
            width: 100%;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            padding: 12px 13px;

            font-size: 15px;

            outline: none;

            margin-bottom: 18px;
        }

        .input:focus {
            border-color: #6d4aff;

            box-shadow:
                0 0 0 3px rgba(109, 74, 255, 0.10);
        }

        textarea.input {
            min-height: 115px;
            resize: vertical;

            font-family: inherit;
        }

        .submit-btn {
            width: 100%;

            border: 0;
            border-radius: 11px;

            padding: 14px 16px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;

            background: #ecfdf5;
            color: #166534;

            border: 1px solid #bbf7d0;
        }

        .message.error {
            display: block;

            background: #fef2f2;
            color: #b91c1c;

            border: 1px solid #fecaca;
        }

        .privacy-note {
            text-align: center;

            margin-top: 17px;

            color: #94a3b8;

            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 520px) {

            .review-page {
                align-items: flex-start;

                padding:
                    18px 14px;
            }

            .review-card {
                padding:
                    24px 18px;

                border-radius: 15px;
            }

            .star {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <main class="review-page">

        <section class="review-card">

            <div class="brand">
                <span>Cerood</span>
            </div>

            <h1 class="title">
                How was your service?
            </h1>

            <p class="subtitle">
                Your feedback helps us improve
                Cerood services.
            </p>


            <div class="service-card" id="serviceCard">

    <img
        id="productImage"
        class="product-image"
        src=""
        alt="Service"
    >

    <div class="service-info">

        <div
            class="product-name"
            id="productName"
        >
            Loading service...
        </div>

        <div class="service-order-id">
            Order
            <strong id="orderNumber">
                Loading...
            </strong>
        </div>

        <div
            class="service-status"
            id="serviceStatus"
        >
            Checking status...
        </div>

        <div
            class="service-extra"
            id="serviceExtra"
        ></div>

    </div>

</div>



            <label class="field-label">
                Your rating
            </label>

            <div
                class="stars"
                id="stars"
            >

                <button
                    type="button"
                    class="star"
                    data-rating="1"
                    aria-label="1 star"
                >★</button>

                <button
                    type="button"
                    class="star"
                    data-rating="2"
                    aria-label="2 stars"
                >★</button>

                <button
                    type="button"
                    class="star"
                    data-rating="3"
                    aria-label="3 stars"
                >★</button>

                <button
                    type="button"
                    class="star"
                    data-rating="4"
                    aria-label="4 stars"
                >★</button>

                <button
                    type="button"
                    class="star"
                    data-rating="5"
                    aria-label="5 stars"
                >★</button>

            </div>

            <div
                class="rating-text"
                id="ratingText"
            >
                Select a rating
            </div>


            <label
                class="field-label"
                for="customerPhone"
            >
                Mobile Number
            </label>

            <input
                id="customerPhone"
                class="input"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="Enter service booking mobile number"
            >


            <label
                class="field-label"
                for="reviewText"
            >
                Tell us about your experience
            </label>

            <textarea
                id="reviewText"
                class="input"
                maxlength="1000"
                placeholder="Write your genuine service experience..."
            ></textarea>


            <button
                id="submitReviewBtn"
                class="submit-btn"
                type="button"
            >
                Submit Review
            </button>


            <div
                id="reviewMessage"
                class="message"
            ></div>

            <a
    id="googleReviewBtn"
    href="https://g.page/r/CfI4xdZRpLixEBM/review"
    target="_blank"
    rel="noopener noreferrer"
    style="
        display:none;
        width:100%;
        margin-top:14px;
        padding:14px 16px;
        border-radius:11px;
        background:#ffffff;
        border:1px solid #d1d5db;
        color:#111827;
        text-decoration:none;
        text-align:center;
        font-size:15px;
        font-weight:700;
        box-shadow:0 2px 8px rgba(0,0,0,0.06);
    "
>
    ★ Review Cerood on Google
</a>


            <div class="privacy-note">
                Reviews are checked before
                being published on Cerood.
            </div>

        </section>

    </main>


    <script>

        const API_BASE_URL =
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://catus-backend-d2js.onrender.com';


        // ==========================================
        // ORDER ID FROM URL
        // ==========================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const orderId =
            String(
                params.get('order') || ''
            ).trim();

        let loadedOrder = null;


        const orderNumber =
            document.getElementById(
                'orderNumber'
            );

        const submitButton =
            document.getElementById(
                'submitReviewBtn'
            );

        const messageBox =
            document.getElementById(
                'reviewMessage'
            );


        if (orderId) {

    loadReviewOrder();

} else {

    orderNumber.textContent =
        'Invalid Order';

    submitButton.disabled = true;

    showMessage(
        'Invalid review link. Order ID is missing.',
        'error'
    );
}

// ==========================================
// LOAD ORDER DETAILS FOR REVIEW
// ==========================================

async function loadReviewOrder() {

    try {

        orderNumber.textContent =
            `#${orderId}`;

        const response =
            await fetch(
                `${API_BASE_URL}/api/customer-reviews/order/${encodeURIComponent(orderId)}`
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success ||
            !data.order
        ) {
            throw new Error(
                data.message ||
                'Unable to load service order.'
            );
        }

        loadedOrder = data.order;

        // ==========================================
// CHECK IF REVIEW ALREADY SUBMITTED
// ==========================================

const reviewStatusResponse =
    await fetch(
        `${API_BASE_URL}/api/reviews/order-status/${encodeURIComponent(orderId)}`
    );

const reviewStatusData =
    await reviewStatusResponse.json();

if (
    reviewStatusResponse.ok &&
    reviewStatusData.success &&
    reviewStatusData.reviewed
) {

    const existingReview =
        reviewStatusData.review || {};

    // Product details continue to load,
    // but remember that this order is reviewed.
    data.already_reviewed = true;
    data.existing_review = existingReview;

} else {

    data.already_reviewed = false;
}


        // ==========================================
        // SHOW ORDER / PRODUCT DETAILS FIRST
        // Works for Assigned + Completed
        // ==========================================

        const productImage =
            document.getElementById(
                'productImage'
            );

        const productName =
            document.getElementById(
                'productName'
            );

        const serviceStatus =
            document.getElementById(
                'serviceStatus'
            );

        const serviceExtra =
            document.getElementById(
                'serviceExtra'
            );


        // ORDER NUMBER
        orderNumber.textContent =
            `#${loadedOrder.order_id}`;


        // PRODUCT / SERVICE NAME
        productName.textContent =
            loadedOrder.product_name ||
            'Cerood Service';


        // PRODUCT IMAGE
        if (
            loadedOrder.product_image &&
            String(
                loadedOrder.product_image
            ).trim()
        ) {

            productImage.src =
                loadedOrder.product_image;

            productImage.alt =
                loadedOrder.product_name ||
                'Cerood Service';

            productImage.style.display =
                'block';

        } else {

            productImage.style.display =
                'none';

            console.warn(
                'Product image not available:',
                loadedOrder
            );
        }


        // STATUS
        const currentStatus =
            String(
                loadedOrder.status || ''
            ).trim();


        serviceStatus.textContent =
            currentStatus || 'Unknown';


        if (
            currentStatus.toLowerCase() ===
            'completed'
        ) {

            serviceStatus.className =
                'service-status completed';

        } else {

            serviceStatus.className =
                'service-status pending';
        }


        // EXTRA ORDER DETAILS
        const extraDetails = [];


        if (loadedOrder.service_category) {

            extraDetails.push(
                `Service: ${loadedOrder.service_category}`
            );
        }


        if (loadedOrder.district) {

            extraDetails.push(
                `📍 ${loadedOrder.district}`
            );
        }


        if (loadedOrder.technician_name) {

            extraDetails.push(
                `Technician: ${loadedOrder.technician_name}`
            );
        }


        serviceExtra.innerHTML =
            extraDetails.join('<br>');


        // ==========================================
        // ONLY AFTER DETAILS ARE DISPLAYED
        // CHECK WHETHER REVIEW IS ALLOWED
        // ==========================================

        if (!data.review_allowed) {

            document.getElementById(
                'stars'
            ).style.display = 'none';

            document.getElementById(
                'ratingText'
            ).style.display = 'none';

            document.getElementById(
                'customerPhone'
            ).style.display = 'none';

            document.getElementById(
                'reviewText'
            ).style.display = 'none';


            document.querySelectorAll(
                '.field-label'
            ).forEach(label => {

                label.style.display =
                    'none';

            });


            submitButton.style.display =
                'none';


            showMessage(
                `Review will be available after this service is completed. Current status: ${currentStatus || 'Unknown'}.`,
                'error'
            );

            return;
        }

        // ==========================================
// REVIEW ALREADY SUBMITTED
// ==========================================

if (data.already_reviewed) {

    document.getElementById(
        'stars'
    ).style.display = 'none';

    document.getElementById(
        'ratingText'
    ).style.display = 'none';

    document.getElementById(
        'customerPhone'
    ).style.display = 'none';

    document.getElementById(
        'reviewText'
    ).style.display = 'none';

    document.querySelectorAll(
        '.field-label'
    ).forEach(label => {

        label.style.display = 'none';

    });

    submitButton.style.display =
        'none';


    const existingRating =
        Number(
            data.existing_review?.rating || 0
        );

    const existingText =
        String(
            data.existing_review?.review_text || ''
        ).trim();


    let message =
        '✓ Review Already Submitted';

    if (existingRating) {

        message +=
            ` — ${existingRating}/5 ★`;
    }

    if (existingText) {

        message +=
            ` — ${existingText}`;
    }


    showMessage(
    message,
    'success'
);

document.getElementById(
    'googleReviewBtn'
).style.display = 'block';

return;
}


        // ==========================================
        // COMPLETED ORDER
        // ==========================================

        document.getElementById(
            'stars'
        ).style.display = 'flex';

        document.getElementById(
            'ratingText'
        ).style.display = 'block';

        document.getElementById(
            'customerPhone'
        ).style.display = 'block';

        document.getElementById(
            'reviewText'
        ).style.display = 'block';


        document.querySelectorAll(
            '.field-label'
        ).forEach(label => {

            label.style.display =
                'block';

        });


        submitButton.style.display =
            'block';

        submitButton.disabled =
            false;


        showMessage(
            'Service completed. You can now submit your review.',
            'success'
        );


    } catch (error) {

        console.error(
            'Review Order Load Error:',
            error
        );


        productName.textContent =
            'Unable to load service';


        document.getElementById(
            'serviceStatus'
        ).textContent =
            'Unavailable';


        submitButton.style.display =
            'none';


        showMessage(
            error.message,
            'error'
        );
    }
}
        // ==========================================
        // STAR RATING
        // ==========================================

        let selectedRating = 0;

        const stars =
            Array.from(
                document.querySelectorAll(
                    '.star'
                )
            );

        const ratingText =
            document.getElementById(
                'ratingText'
            );


        const ratingLabels = {
            1: 'Poor',
            2: 'Fair',
            3: 'Good',
            4: 'Very Good',
            5: 'Excellent'
        };


        stars.forEach(star => {

            star.addEventListener(
                'click',
                () => {

                    selectedRating =
                        Number(
                            star.dataset.rating
                        );

                    updateStars();
                }
            );
        });


        function updateStars() {

            stars.forEach(star => {

                const rating =
                    Number(
                        star.dataset.rating
                    );

                star.classList.toggle(
                    'active',
                    rating <= selectedRating
                );
            });


            ratingText.textContent =
                selectedRating
                    ? `${selectedRating}/5 — ${
                        ratingLabels[
                            selectedRating
                        ]
                    }`
                    : 'Select a rating';
        }


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(
            message,
            type
        ) {

            messageBox.textContent =
                message;

            messageBox.className =
                `message ${type}`;
        }


        // ==========================================
        // SUBMIT REVIEW
        // ==========================================

        async function submitReview() {

            const customerPhone =
                String(
                    document
                        .getElementById(
                            'customerPhone'
                        )
                        .value || ''
                )
                    .replace(/\D/g, '')
                    .slice(-10);


            const reviewText =
                String(
                    document
                        .getElementById(
                            'reviewText'
                        )
                        .value || ''
                ).trim();


            if (!orderId) {

                showMessage(
                    'Invalid service order.',
                    'error'
                );

                return;
            }


            if (!selectedRating) {

                showMessage(
                    'Please select your rating.',
                    'error'
                );

                return;
            }


            if (
                !/^[6-9]\d{9}$/.test(
                    customerPhone
                )
            ) {

                showMessage(
                    'Enter the 10-digit mobile number used for this booking.',
                    'error'
                );

                return;
            }


            submitButton.disabled = true;

            submitButton.textContent =
                'Submitting...';


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/reviews`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            
                            body: JSON.stringify({

    service_id:
        String(
            loadedOrder.product_id
        ),

    order_id:
        orderId,

    phone:
        customerPhone,

    rating:
        selectedRating,

    review_text:
        reviewText
})
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        'Unable to submit review.'
                    );
                }


                showMessage(
                    'Thank you! Your review has been submitted successfully.',
                    'success'
                );

                document.getElementById(
    'googleReviewBtn'
).style.display = 'block';


                stars.forEach(
                    star => {
                        star.disabled = true;
                    }
                );

                document
                    .getElementById(
                        'customerPhone'
                    )
                    .disabled = true;

                document
                    .getElementById(
                        'reviewText'
                    )
                    .disabled = true;


                submitButton.textContent =
                    'Review Submitted';


            } catch (error) {

                console.error(
                    'Review Submit Error:',
                    error
                );


                showMessage(
                    error.message,
                    'error'
                );


                submitButton.disabled =
                    false;

                submitButton.textContent =
                    'Submit Review';
            }
        }


        submitButton.addEventListener(
            'click',
            submitReview
        );

    </script>

</body>

</html>
