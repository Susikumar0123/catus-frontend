<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cerood Renewed | Admin Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211a36}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0%,#e8ddff,transparent 45%),#f8f7fc}.card{width:min(100%,420px);background:#fff;border:1px solid #e9e2f6;border-radius:22px;padding:34px;box-shadow:0 22px 70px rgba(50,27,110,.09)}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#6945d8;color:white;font-size:23px}h1{font-size:25px;margin:22px 0 8px;letter-spacing:-.04em}p{color:#726983;font-size:13px;line-height:1.6;margin:0 0 27px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#6945d8;margin-top:17px}label{display:block;font-size:12px;font-weight:750;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #dcd5eb;border-radius:10px;font:inherit;font-size:14px}input:focus{outline:2px solid #b6a5f4;border-color:#6945d8}button{width:100%;padding:14px;margin-top:22px;background:#6945d8;color:#fff;border:0;border-radius:11px;font-size:14px;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{display:none;color:#9b1c1c;background:#fff0f0;border:1px solid #f4c5c5;border-radius:9px;padding:11px;margin-top:14px;font-size:12px;line-height:1.5}.back{display:block;text-align:center;margin-top:23px;color:#6945d8;font-size:12px;text-decoration:none;font-weight:700}</style></head>
<body><main class="card"><div class="mark"><i class="fa-solid fa-recycle"></i></div><div class="eyebrow">CEROOD RENEWED · SECURE ACCESS</div><h1>Renewed Admin Login</h1><p>Manage refurbished products, orders and delivery tracking in the separate Renewed admin panel.</p><form id="loginForm"><label for="username">Admin username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submitBtn" type="submit"><i class="fa-solid fa-lock"></i> Login to Renewed Admin</button><div class="error" id="errorMsg" role="alert"></div></form><a class="back" href="renewed.html">← Back to Renewed Store</a></main>
<script>
(function(){'use strict';
 const API=location.hostname==='localhost'?'http://localhost:3000':'https://catus-backend-d2js.onrender.com';
 if(sessionStorage.getItem('renewedAdminAuthenticated')==='true'&&sessionStorage.getItem('renewedAdminToken'))location.replace('renewed-admin.html');
 const form=document.getElementById('loginForm'),button=document.getElementById('submitBtn'),error=document.getElementById('errorMsg');
 form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';button.disabled=true;button.textContent='Signing in…';
 try{const response=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});
 const data=await response.json().catch(()=>({}));if(!response.ok||!data.success||!data.token)throw Error(data.message||'Invalid username or password.');
 sessionStorage.setItem('renewedAdminToken',data.token);sessionStorage.setItem('renewedAdminAuthenticated','true');location.replace('renewed-admin.html');
 }catch(err){error.textContent=err.message||'Unable to connect to the server.';error.style.display='block';}finally{button.disabled=false;button.innerHTML='<i class="fa-solid fa-lock"></i> Login to Renewed Admin';}});
})();
</script></body></html>
