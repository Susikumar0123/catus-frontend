</style><script defer src="/cerood-india-data.js?v=1"></script><script defer src="/cerood-india-select.js?v=1"></script></head><body><aside class="brand-panel"><img src="/brand/logo-white.png" alt="Cerood"><h1>Your business.<br>One workspace.</h1></aside><main><section class="reset-card"><a href="/seller-dashboard-test/connected.html">← Seller sign in</a><h2>Reset your password</h2><p class="muted">Verify your registered mobile number to create a new password.</p>
<form id="phoneForm"><label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" autocomplete="username" required><div id="captcha"></div><button id="send" type="submit">Send OTP</button></form>
<form id="otpForm" hidden><p id="sentTo" class="muted"></p><label for="otp">Verification code</label><input id="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="8" pattern="[0-9]{4,8}" required><button id="verify" type="submit">Verify OTP</button><p id="countdown" aria-live="off"></p><div class="row"><button id="resend" type="button" class="secondary" disabled>Resend OTP</button><button id="edit" type="button" class="secondary">Change number</button></div></form>

<script>
(function(){'use strict';const $=id=>document.getElementById(id);let phone='',proof='',request='',busy=false,deadline=0,timer=null,epoch=0;const forms=['phoneForm','otpForm','passwordForm','complete'];function show(id){forms.forEach(x=>$(x).hidden=x!==id);$('status').textContent='';}function tick(){const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('resend').disabled=busy||n>0;$('countdown').textContent=n?'Resend OTP in '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'You can resend the code.';if(!n&&timer){clearInterval(timer);timer=null;}}function cooldown(){deadline=Date.now()+60000;if(timer)clearInterval(timer);tick();timer=setInterval(tick,250);}function lock(value){busy=value;['send','verify','save','edit'].forEach(id=>$(id).disabled=value);tick();}function error(e){$('status').className='';$('status').textContent=e?.message||'Unable to continue. Please try again.';}function call(method,args){return new Promise((resolve,reject)=>{if(typeof window[method]!=='function'){reject(Error('OTP service is loading. Please try again.'));return;}const timeout=setTimeout(()=>reject(Error('OTP service took too long. Please try again.')),45000);const ok=data=>{clearTimeout(timeout);if(data&&String(data.type||'').toLowerCase()==='error')reject(Error('OTP request failed. Please retry.'));else resolve(data);};const fail=()=>{clearTimeout(timeout);reject(Error('OTP could not be completed. Check the code or request a new OTP.'));};try{window[method](...args,ok,fail,...(method==='retryOtp'?[request]:[]));}catch(e){clearTimeout(timeout);reject(e);}});}function requestId(d){if(typeof d==='string')return d;return String(d?.reqId||d?.req_id||d?.requestId||d?.request_id||d?.data?.reqId||d?.data?.req_id||d?.message||'');}function accessToken(d){if(typeof d==='string')return d;return String(d?.accessToken||d?.access_token||d?.['access-token']||d?.data?.accessToken||d?.data?.access_token||d?.data?.['access-token']||d?.message||'');}
$('phoneForm').onsubmit=async e=>{e.preventDefault();if(busy||Date.now()<deadline)return;if(!$('phoneForm').reportValidity())return;lock(true);try{if(typeof window.isCaptchaVerified!=='function'||!window.isCaptchaVerified())throw Error('Complete the security check before sending OTP.');phone=$('phone').value.trim();proof='';const data=await call('sendOtp',['91'+phone]);request=requestId(data);if(!request)throw Error('OTP request could not be started. Retry.');$('sentTo').textContent='Enter the code sent to +91 '+phone;show('otpForm');cooldown();$('otp').focus();}catch(e){error(e);}finally{lock(false);}};

$('edit').onclick=()=>{if(busy)return;epoch++;proof='';request='';$('otp').value='';$('password').value='';$('confirm').value='';show('phoneForm');$('phone').focus();};
$('otpForm').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!$('otpForm').reportValidity())return;lock(true);try{const data=await call('verifyOtp',[$('otp').value.trim()]);proof=accessToken(data);if(!proof)throw Error('OTP verification token missing. Request a new OTP.');show('passwordForm');$('password').focus();}catch(e){error(e);}finally{lock(false);}};
$('passwordForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const password=$('password').value,confirm=$('confirm').value;if(password.length<8||new TextEncoder().encode(password).length>72){error(Error('Use a password of at least 8 characters and no more than 72 bytes.'));return;}if(password!==confirm){error(Error('Passwords do not match.'));$('confirm').focus();return;}if(!proof){error(Error('Verify your mobile OTP first.'));return;}lock(true);try{const response=await fetch('https://catus-backend-d2js.onrender.com/api/sellers/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(45000),body:JSON.stringify({phone,password,confirm_password:confirm,accessToken:proof})});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||'Unable to reset password.');sessionStorage.removeItem('ceroodSellerConnectedToken');proof='';$('password').value='';$('confirm').value='';show('complete');}catch(e){error(e);}finally{lock(false);}};
document.querySelectorAll('[data-eye]').forEach(button=>button.onclick=()=>{const input=$(button.dataset.eye),visible=input.type==='password';input.type=visible?'text':'password';button.textContent=visible?'Hide':'Show';button.setAttribute('aria-label',(visible?'Hide ':'Show ')+(input.id==='confirm'?'confirm password':'password'));});
function load(urls,index=0){const script=document.createElement('script');script.src=urls[index];script.async=true;script.onerror=()=>{if(index+1<urls.length)load(urls,index+1);else error(Error('Could not load OTP service. Refresh and retry.'));};script.onload=()=>{if(typeof window.initSendOTP!=='function'){error(Error('OTP service unavailable. Refresh and retry.'));return;}window.initSendOTP({widgetId:'366965657347303138353039',tokenAuth:'567815T0OZZpNFK06a9ba743P1',exposeMethods:true,captchaRenderId:'captcha',success:()=>{},failure:()=>error(Error('Security verification failed. Please retry.'))});};document.head.append(script);}load(['https://verify.msg91.com/otp-provider.js','https://verify.phone91.com/otp-provider.js']);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
})();
